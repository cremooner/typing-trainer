<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盲打训练器</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#ffffff; --panel2:#efeeea; --text:#232320; --muted:#55554f; --faint:#6f6e68;
  --done:#a5ada6;
  --line:rgba(0,0,0,.14); --line2:rgba(0,0,0,.07);
  --accent:#1f6fb2; --accentbg:#e6f1fb; --accentfg:#16578d;
  --bad:#a32d2d; --badbg:#fcebeb; --danger:#b3261e;
  --keybg:#f2f1ec; --keyline:rgba(0,0,0,.14); --keyfg:#2c2c2a;
}
[data-theme="dark"]{
  --bg:#000000; --panel:#101010; --panel2:#1b1b1b; --text:#e9e9e5; --muted:#ababa4; --faint:#8f8f88;
  --done:#5e635c;
  --line:rgba(255,255,255,.17); --line2:rgba(255,255,255,.08);
  --accent:#6fb0ee; --accentbg:#0d2b45; --accentfg:#9cc9f4;
  --bad:#ff9d9d; --badbg:#3a1212; --danger:#ff8a80;
  --keybg:#1c1c1c; --keyline:rgba(255,255,255,.14); --keyfg:#d6d6d0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:0 auto;padding:18px 20px 56px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-size:15px;font-weight:600;letter-spacing:.02em;margin-right:6px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{
  border:.5px solid var(--line); background:transparent; color:var(--muted);
  padding:5px 12px; border-radius:999px; cursor:pointer; font-size:13px;
  font-family:inherit; transition:background .12s,color .12s;
}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.on{background:var(--accentbg);color:var(--accentfg);border-color:var(--accent)}
.spacer{flex:1;min-width:0}
.ghost{
  border:.5px solid var(--line); background:transparent; color:var(--muted);
  padding:5px 11px; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit;
  white-space:nowrap;
}
.ghost:hover{border-color:var(--accent);color:var(--text)}
.ghost.danger{color:var(--danger);border-color:var(--danger)}
select.ghost{padding:5px 8px}
.stage{
  background:var(--panel); border:.5px solid var(--line); border-radius:14px;
  padding:22px 24px 18px; position:relative;
}
.paused .text,.paused .kb,.paused .hud{opacity:.22;filter:grayscale(1)}
.pausemark{
  display:none; position:absolute; inset:0; align-items:center; justify-content:center;
  font-size:14px; color:var(--muted); pointer-events:none;
}
.paused .pausemark{display:flex}
.notice{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.notice:empty{display:none}
.text{
  font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
  font-size:var(--tsize,22px); line-height:2.05; white-space:pre-wrap;
  min-height:150px; max-height:300px; overflow:hidden; letter-spacing:.01em;
}
.c{display:inline-block;border-bottom:2px solid transparent;border-radius:2px;color:var(--text)}
.w{display:inline-block}
.c.sp{width:.62em}
.c.cur{border-bottom-color:var(--accent)}
.c.ok{color:var(--done)}
.c.no{color:var(--bad);background:var(--badbg)}
.card{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:272px;padding:6px 0 2px}
.stage.cardmode .card{display:flex}
.stage.cardmode .text{display:none}
.cprog{font-size:12px;color:var(--faint);margin-bottom:16px;letter-spacing:.06em}
.cword{font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;font-size:56px;line-height:1.35;margin-bottom:4px;letter-spacing:0;max-width:100%}
.cword .c{border-bottom-width:3px}
.cphone{font-size:15px;color:var(--muted);margin-bottom:16px;font-family:ui-monospace,Consolas,monospace;letter-spacing:.02em}
.cmean{font-size:17px;line-height:1.95;max-width:660px}
.cmean .pos{color:var(--accent);font-style:italic;margin-right:6px;font-size:15px}
.cmean .sn{color:var(--faint);font-size:13px;margin-right:6px}
.pp{display:inline-block;background:var(--panel2);border-radius:8px;padding:3px 11px;margin:0 6px 6px 0;font-size:15px;white-space:nowrap}
.pp b{font-weight:500;font-family:ui-monospace,Consolas,monospace;font-size:14px}
.pp i{font-style:normal;color:var(--muted);margin-left:8px}
.cex{margin-top:20px;max-width:680px;font-size:13px;line-height:1.75;color:var(--muted)}
.cex .en{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.cex .cn{color:var(--faint);margin-top:4px}
.cskip{margin-top:22px;border:.5px solid var(--line);background:transparent;color:var(--faint);font-family:inherit;font-size:12px;padding:4px 13px;border-radius:8px;cursor:pointer}
.cskip:hover{border-color:var(--accent);color:var(--text)}
@keyframes cardin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.card.in .cword,.card.in .cphone,.card.in .cmean,.card.in .cex{animation:cardin .19s ease-out}
@media(prefers-reduced-motion:reduce){.card.in .cword,.card.in .cphone,.card.in .cmean,.card.in .cex{animation:none}}
.bar{height:3px;border-radius:3px;background:var(--panel2);margin:16px 0 18px;overflow:hidden}
.bar>i{display:block;height:3px;width:0;background:var(--accent);border-radius:3px;transition:width .1s linear}
.hud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.cell{background:var(--panel2);border-radius:10px;padding:9px 12px;min-width:0}
.cell .lb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v{font-size:22px;font-weight:500;line-height:1.25;font-variant-numeric:tabular-nums}
.cell .v.bad{color:var(--bad)}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;margin-bottom:14px}
.kb.off{display:none}
.kbr{display:flex;gap:6px}
.k{
  width:40px;height:40px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:12px;user-select:none;border:.5px solid var(--keyline);background:var(--keybg);color:var(--keyfg);
  transition:transform .06s,box-shadow .06s;
}
.k.sh{width:60px;font-size:11px;color:var(--muted)}
.k.wide{width:238px}
.k.next{box-shadow:inset 0 0 0 2px var(--accent)}
.k.hit{transform:translateY(1px);filter:brightness(1.28)}
[data-theme="light"] .k.hit{filter:brightness(.88)}
.hintline{font-size:12.5px;color:var(--muted);text-align:center;min-height:19px;margin-bottom:8px}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint);gap:12px;flex-wrap:wrap}
kbd{
  font-family:inherit;font-size:11.5px;border:.5px solid var(--line);border-bottom-width:2px;
  border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--panel2)
}
.warnbar{
  margin-top:12px;font-size:12.5px;color:var(--danger);border:.5px solid var(--danger);
  border-radius:10px;padding:8px 12px;background:var(--panel)
}
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:50;
}
[data-theme="light"] .mask{background:rgba(40,40,38,.42)}
.mask.on{display:flex}
.dlg{
  background:var(--panel);border-radius:16px;border:.5px solid var(--line);
  padding:24px 26px;width:100%;max-width:540px;max-height:88vh;overflow:auto;outline:none
}
.dlg.wide{max-width:780px}
.dlg h2{margin:0 0 4px;font-size:15px;font-weight:600}
.dlg .sub{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.bigc{background:var(--panel2);border-radius:12px;padding:14px 16px;position:relative}
.bigc .lb{font-size:12px;color:var(--muted)}
.bigc .v{font-size:34px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.bigc .v.bad{color:var(--bad)}
.badge{
  position:absolute;top:12px;right:12px;font-size:11px;padding:1px 7px;border-radius:999px;
  background:var(--accentbg);color:var(--accentfg)
}
.mini{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:8px}
.mini>div{background:var(--panel2);border-radius:10px;padding:9px 11px}
.mini .lb{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mini .v{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.cmp{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.cmp b{font-weight:500}
.up{color:#3f8f5a}
.dn{color:#c0392b}
.sec{font-size:12px;color:var(--muted);margin:16px 0 8px;letter-spacing:.04em}
.errtab{display:flex;flex-wrap:wrap;gap:6px}
.errtab span{
  font-family:ui-monospace,Consolas,monospace;font-size:12.5px;
  background:var(--badbg);color:var(--bad);border-radius:6px;padding:2px 8px
}
.errtab span i{font-style:normal;opacity:.65}
.slow{display:flex;flex-wrap:wrap;gap:6px}
.slow span{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--panel2);border-radius:6px;padding:2px 8px}
.caliber{font-size:11.5px;color:var(--faint);line-height:1.75;margin-top:14px}
.acts{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.acts button{
  border:.5px solid var(--line);background:transparent;color:var(--text);font-family:inherit;
  font-size:13px;padding:7px 16px;border-radius:9px;cursor:pointer;white-space:nowrap
}
.acts button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.acts button.danger{color:var(--danger);border-color:var(--danger)}
[data-theme="dark"] .acts button.pri{color:#07121c}
.acts button:hover{opacity:.85}
.modepick{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%;justify-content:flex-end}
.modepick button{font-size:12px;padding:6px 12px;border-radius:8px;border:.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-family:inherit}
.modepick button:hover{border-color:var(--accent);color:var(--text)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:.5px solid var(--line2);font-size:13px}
.setrow:last-of-type{border-bottom:none}
.setrow .d{font-size:11.5px;color:var(--muted)}
textarea{
  width:100%;min-height:96px;font-family:ui-monospace,Consolas,monospace;font-size:13px;
  background:var(--panel2);color:var(--text);border:.5px solid var(--line);border-radius:10px;
  padding:10px 12px;resize:vertical;line-height:1.7;outline:none
}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.chartbox{border:.5px solid var(--line2);border-radius:10px;padding:10px 12px 6px}
.chartbox .t{font-size:12px;color:var(--muted);margin-bottom:4px}
canvas{width:100%;height:104px;display:block}
.sumcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.sumcards>div{background:var(--panel2);border-radius:10px;padding:9px 11px}
.sumcards .lb{font-size:11.5px;color:var(--muted)}
.sumcards .v{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.hist{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;table-layout:fixed}
.hist th{text-align:left;color:var(--muted);font-weight:400;font-size:11.5px;padding:5px 6px;border-bottom:.5px solid var(--line)}
.hist td{padding:5px 6px;border-bottom:.5px solid var(--line2);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist td.dim{color:var(--muted)}
.empty{font-size:12.5px;color:var(--faint);padding:14px 0;text-align:center}
.heat{display:flex;flex-direction:column;gap:5px;align-items:center;margin:10px 0 6px}
.heat .kbr{display:flex;gap:5px}
.hk{
  width:38px;height:38px;border-radius:6px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:11px;line-height:1.15;
  border:.5px solid var(--line2);color:var(--text)
}
.hk small{font-size:9.5px;opacity:.8}
.hk.sh{width:54px}
.hk.wide{width:220px}
.legend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:11.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend .ramp{display:flex;height:9px;width:130px;border-radius:5px;overflow:hidden}
.legend .ramp i{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.row select{padding:5px 8px}
@media(max-width:760px){
  .hud{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mini{grid-template-columns:repeat(3,minmax(0,1fr))}
  .k{width:30px;height:30px;font-size:11px}
  .k.sh{width:44px}
  .k.wide{width:170px}
  .hk{width:28px;height:28px;font-size:10px}
  .hk.sh{width:40px}
  .hk.wide{width:150px}
  .bigc .v{font-size:28px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="brand">盲打训练器</span>
    <div class="tabs" id="tabs">
      <button class="tab on" data-mode="lesson">键位</button>
      <button class="tab" data-mode="word">单词</button>
      <button class="tab" data-mode="phrase">句段</button>
      <button class="tab" data-mode="text">文章</button>
      <button class="tab" data-mode="sprint">冲刺</button>
      <button class="tab" data-mode="weak">弱键</button>
    </div>
    <span class="spacer"></span>
    <select class="ghost" id="lessonSel" aria-label="课程"></select>
    <select class="ghost" id="wordLenSel" aria-label="词长">
      <option value="all">混合词长</option>
      <option value="short">短词 ≤4</option>
      <option value="mid">中词 5–7</option>
      <option value="long">长词 ≥8</option>
    </select>
    <select class="ghost" id="wordCountSel" aria-label="每组词数">
      <option value="10">10 词/组</option>
      <option value="20" selected>20 词/组</option>
      <option value="30">30 词/组</option>
      <option value="50">50 词/组</option>
    </select>
    <select class="ghost" id="sprintSel" aria-label="冲刺时长">
      <option value="15">15 秒</option>
      <option value="30" selected>30 秒</option>
      <option value="60">60 秒</option>
      <option value="120">120 秒</option>
    </select>
    <select class="ghost" id="phraseCatSel" aria-label="搭配类别">
      <option value="all">全部类别</option>
      <option value="v">动介搭配</option>
      <option value="be">be 型搭配</option>
      <option value="prep">介词短语</option>
      <option value="n">动名搭配</option>
      <option value="idiom">习语固搭</option>
    </select>
    <select class="ghost" id="phraseCountSel" aria-label="每组段数">
      <option value="5">5 段/组</option>
      <option value="10" selected>10 段/组</option>
      <option value="20">20 段/组</option>
      <option value="30">30 段/组</option>
    </select>
    <button class="ghost" id="btnKb">键盘·指法</button>
    <button class="ghost" id="btnStats">记录</button>
    <button class="ghost" id="btnSetting">设置</button>
    <button class="ghost" id="btnTheme" title="切换深浅色">◐</button>
  </div>

  <div class="stage" id="stage">
    <div class="pausemark">已暂停 · 按 Esc 继续</div>
    <div class="notice" id="notice"></div>
    <div class="text" id="text"></div>
    <div class="card" id="card">
      <div class="cprog" id="cprog"></div>
      <div class="cword" id="cword"></div>
      <div class="cphone" id="cphone"></div>
      <div class="cmean" id="cmean"></div>
      <div class="cex" id="cex"></div>
      <button class="cskip" id="cskip">跳过本词</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="hud">
      <div class="cell"><div class="lb">WPM</div><div class="v" id="hWpm">0</div></div>
      <div class="cell"><div class="lb">准确率</div><div class="v" id="hAcc">100%</div></div>
      <div class="cell"><div class="lb">击键</div><div class="v" id="hKeys">0</div></div>
      <div class="cell"><div class="lb">错误</div><div class="v" id="hErr">0</div></div>
      <div class="cell"><div class="lb" id="hTimeK">用时</div><div class="v" id="hTime">0.0</div></div>
    </div>
    <div class="hintline" id="hint"></div>
    <div class="kb" id="kb"></div>
    <div class="foot">
      <span>首次击键开始计时 · 已拦截粘贴</span>
      <span><kbd>Tab</kbd> 重开 &nbsp; <kbd>Esc</kbd> 暂停 &nbsp; <kbd>Enter</kbd> 结算后重来</span>
    </div>
  </div>
  <div id="storagewarn"></div>

</div>

<div class="mask" id="mResult"><div class="dlg" id="dlgResult" role="dialog" aria-modal="true" aria-label="本次成绩" tabindex="-1" aria-live="polite"></div></div>
<div class="mask" id="mSetting"><div class="dlg" id="dlgSetting" role="dialog" aria-modal="true" aria-label="设置" tabindex="-1"></div></div>
<div class="mask" id="mStats"><div class="dlg wide" id="dlgStats" role="dialog" aria-modal="true" aria-label="成绩记录" tabindex="-1"></div></div>

<script>
/* ---------- 语料 ---------- */
/* 词库来源：CET6_2.json（CET-6 词表 2078 词）

const LESSONS = (()=>{
  const out=[]; let acc='';
  LESSON_GROUPS.forEach(g=>{
    if(g.keys != null && g.add == null) acc = g.keys; else if(g.add) acc += g.add;

  });
  return out;
})();

function load(k, d, ok){
  try{
    const raw = localStorage.getItem(k);
    if(raw == null) return d;
    const v = JSON.parse(raw);
    if(v == null) return d;
    if(ok && !ok(v)) return d;
    return v;
  }catch(e){ return d; }
}

function save(k, v){

}

function mixHex(a, b, t){
  const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const A = p(a), B = p(b);
  return 'rgb(' + A.map((v,i)=>Math.round(v*(1-t) + B[i]*t)).join(',') + ')';
}

const TIER = { short: w => w.length <= 4, mid: w => w.length >= 5 && w.length <= 7, long: w => w.length >= 8 };
function wordPool(tier){ return tier && TIER[tier] ? WORDLIST.filter(TIER[tier]) : WORDLIST; }
function sampleWords(pool, n){
  const out = [], bag = [];
  while(out.length < n){
    if(!bag.length){
      const t = pool.slice();
      for(let i=t.length-1;i>0;i--){ const j = rnd(i+1); const tmp=t[i]; t[i]=t[j]; t[j]=tmp; }
      bag.push.apply(bag, t);
    }
    out.push(bag.shift());
  }
  return out;
}
/* 字典模式：按词长筛词条，并按会话不重复抽样 */
function entryPool(tier){ return tier && TIER[tier] ? DICT.filter(e => TIER[tier](e[0])) : DICT; }
function sampleEntries(pool, n){
  const out = [], bag = [];
  while(out.length < n){
    if(!bag.length){
      const t = pool.slice();
      for(let i=t.length-1;i>0;i--){ const j = rnd(i+1); const tmp=t[i]; t[i]=t[j]; t[j]=tmp; }
      bag.push.apply(bag, t);
    }
    out.push(bag.shift());
  }
  return out;
}
function genLesson(){
  const L = LESSONS[clamp(ST.lesson,0,LESSONS.length-1)];
  const groups = L.keys.length > 12 ? 22 : 20;
  const out = [];
  for(let i=0;i<groups;i++){
    const len = 3 + rnd(3);
    let g = '';
    for(let j=0;j<len;j++){
      let c = L.keys[rnd(L.keys.length)];
      if(L.punct && Math.random() < .18) c = "-=[];',./"[rnd(9)];
      if(L.upper && Math.random() < L.upper) c = c.toUpperCase();
      g += c;
    }
    out.push(g);
  }
  return out.join(' ');
}
/* 句段模式：按搭配类别筛句段，同样按会话不重复抽样 */
function phrasePool(cat){ return cat && cat !== 'all' ? PHRASES.filter(e => e[3] === cat) : PHRASES; }
function genWords(n, tier){ return sampleWords(wordPool(tier || ST.wordLen), n || 36).join(' '); }
function genText(){ return PARAS[rnd(PARAS.length)]; }

function keyStats(){
  const st = load(LSKEY, null, o => o && typeof o === 'object');
  if(st) return Object.assign({err:{}, tries:{}, lat:{}, conf:{}}, st);
  const legacy = load(LSOLD, null, o => o && typeof o === 'object');
  if(legacy){
    const st2 = {err:{}, tries:{}, lat:{}, conf:{}};
    Object.keys(legacy).forEach(c=>{ if(isNum(legacy[c])) st2.err[c] = legacy[c]; });
    return st2;
  }
  return {err:{}, tries:{}, lat:{}, conf:{}};
}
function weakKeys(limit){
  const st = keyStats();
  return Object.keys(st.tries)
    .filter(c => /^[a-z]$/.test(c) && st.tries[c] >= 20 && (st.err[c] || 0) >= 1)
    .map(c => ({ c, tries: st.tries[c], err: st.err[c] || 0, rate: (st.err[c] || 0) / st.tries[c] }))
    .sort((a,b) => b.rate - a.rate || b.err - a.err)
    .slice(0, limit || 6);
}
function genWeak(){
  const w = weakKeys(6);
  if(!w.length){
    return { text: genWords(36, 'all'), weak: [], reason: 'no-data' };
  }
  const letters = w.map(x => x.c);
  const pool = WORDLIST.filter(word => letters.some(c => word.indexOf(c) > -1));
  const use = pool.length >= 20 ? pool : WORDLIST;
  return { text: sampleWords(use, 36).join(' '), weak: w, reason: pool.length >= 20 ? 'ok' : 'thin-pool' };
}

/* ---------- 文本渲染 ---------- */
function pushText(str){
  const frag = document.createDocumentFragment();
  for(const ch of str){
    if(ch === ' '){
      const s = document.createElement('span');
      s.className = 'c sp'; s.textContent = '';
      frag.appendChild(s); S.charEls.push(s); S.lastWordEl = null;
    } else {
      if(!S.lastWordEl){
        S.lastWordEl = document.createElement('span');
        S.lastWordEl.className = 'w';
        frag.appendChild(S.lastWordEl);
      }
      const c = document.createElement('span');
      c.className = 'c'; c.textContent = ch;
      S.lastWordEl.appendChild(c); S.charEls.push(c);
    }
  }
  $('#text').appendChild(frag);
}
function renderText(){
  const t = $('#text');
  t.textContent = ''; t.scrollTop = 0;
  S.charEls = []; S.lastWordEl = null;
  pushText(S.target);
  if(S.charEls[0]) S.charEls[0].classList.add('cur');
}

/* ---------- 虚拟键盘 ---------- */
function kbLabel(k){ return k === 'SHIFT_L' ? 'Shift' : k === 'SHIFT_R' ? 'Shift' : k; }
function buildKb(){
  const kb = $('#kb'); kb.textContent = '';
  KEYROWS.forEach((row,ri)=>{
    const d = document.createElement('div');
    d.className = 'kbr';
    d.style.marginLeft = [0,14,24,38][ri] + 'px';
    row.forEach(k=>{
      const e = document.createElement('div');
      e.className = 'k' + (k.indexOf('SHIFT') === 0 ? ' sh' : '');
      e.dataset.key = k.indexOf('SHIFT') === 0 ? 'shift' : k;
      if(k === 'SHIFT_L') e.dataset.side = 'L';
      if(k === 'SHIFT_R') e.dataset.side = 'R';
      e.textContent = kbLabel(k);
      d.appendChild(e);
    });
    kb.appendChild(d);
  });
  const d = document.createElement('div');
  d.className = 'kbr';
  const sp = document.createElement('div');
  sp.className = 'k wide'; sp.dataset.key = ' '; sp.textContent = 'space';
  d.appendChild(sp); kb.appendChild(d);
  paintKb();
}
function paintKb(){
  const dark = ST.theme === 'dark';
  $('#kb').querySelectorAll('.k').forEach(el=>{
    const key = el.dataset.key;
    const f = FINGER[key];
    if(ST.kbStyle === 'finger' && f){
      const c = FPAL[f];
      el.style.background = dark ? mixHex(c, '#151515', .82) : mixHex(c, '#ffffff', .38);
      el.style.borderColor = dark ? mixHex(c, '#151515', .5) : mixHex(c, '#ffffff', .05);
      el.style.color = dark ? '#dcdcd6' : '#2c2c2a';
    } else {
      el.style.background = ''; el.style.borderColor = ''; el.style.color = '';
    }
  });
}
function kbKeyEl(ch){
  const base = ch.toLowerCase();
  if(/[a-z]/.test(base)) return $('#kb').querySelector('.k[data-key="' + base + '"]');
  if(base === ' ') return $('#kb').querySelector('.k[data-key=" "]');
  const shifted = SHIFT_OF[ch];
  const src = shifted !== undefined ? shifted : ch;
  return $('#kb').querySelector('.k[data-key="' + src.replace(/["\\]/g, '\\$&') + '"]');
}
function kbClearNext(){ $('#kb').querySelectorAll('.k.next').forEach(e => e.classList.remove('next')); }
function kbNext(){
  kbClearNext();
  if(!ST.hint || S.done || ST.kbStyle === 'off'){ $('#hint').textContent = ''; return; }
  const ch = S.target[S.pos];
  if(ch == null){ $('#hint').textContent = ''; return; }
  const e = kbKeyEl(ch);
  if(e) e.classList.add('next');
  const needShift = /[A-Z]/.test(ch) || SHIFT_OF[ch] !== undefined;
  const base = SHIFT_OF[ch] !== undefined ? SHIFT_OF[ch] : ch.toLowerCase();
  const f = FINGER[base];
  const label = ch === ' ' ? '空格' : ch;
  let txt = '下一个：' + label;
  let fingerTxt = ch === ' ' ? '拇指' : (f ? FNAME[f] : '');
  if(needShift && f){
    const side = f <= 4 ? 'R' : 'L';
    const se = $('#kb').querySelector('.k[data-key="shift"][data-side="' + side + '"]');
    if(se) se.classList.add('next');
    txt += '  ·  ' + fingerTxt + ' + ' + (side === 'R' ? '右' : '左') + ' Shift';
    $('#hint').textContent = txt;
    return;
  }
  $('#hint').textContent = txt + (fingerTxt ? '  ·  ' + fingerTxt : '');
}
function kbHit(ch){
  const e = kbKeyEl(ch);
  if(!e) return;
  e.classList.add('hit');
  setTimeout(()=>e.classList.remove('hit'), 90);
}

/* ---------- 音效 ---------- */
let AC = null;
function beep(freq, dur, vol){
  if(!ST.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(AC.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
    o.stop(AC.currentTime + dur);
  }catch(e){}
}

/* ---------- 会话 ---------- */
function resetHud(){
  $('#hWpm').textContent = '0';
  $('#hAcc').textContent = '100%';
  $('#hKeys').textContent = '0';
  $('#hErr').textContent = '0';
  $('#hErr').classList.remove('bad');
  $('#hTimeK').textContent = S.mode === 'sprint' ? '剩余' : '用时';
  $('#hTime').textContent = S.mode === 'sprint' ? S.limit.toFixed(1) : '0.0';
  $('#bar').style.width = '0%';
}
function newSession(mode, reuse){
  if(mode) S.mode = mode;
  clearInterval(S.tick); S.tick = null;
  S.view = (S.mode === 'word' || S.mode === 'phrase') ? 'card' : 'flow';
  Object.assign(S, {
    target:'', pos:0, state:[], charEls:[], lastWordEl:null,
    keys:0, errs:0, settled:0, backs:0, tried:0, firstOk:0,
    posTried:new Uint8Array(0), gaps:[], lastTs:0,
    startTs:0, pauseTs:0, pausedMs:0, paused:false, running:false, done:false,
    errDetail:{}, conf:{}, tries:{}, errByWant:{}, lat:{}, badWords:new Set(),
    queue:[], idx:0, wordErr:0, wordLog:[], doneChars:0, totalChars:0,
    limit:0
  });
  $('#notice').textContent = '';
  $('#stage').classList.toggle('cardmode', S.view === 'card');

  if(S.view === 'card'){
    if(reuse && S._reuseQueue){ S.queue = S._reuseQueue; S._reuseQueue = null; }
    else if(S.mode === 'phrase') S.queue = sampleEntries(phrasePool(ST.phraseCat), clamp(ST.phraseCount, 1, 100));
    else S.queue = sampleEntries(entryPool(ST.wordLen), clamp(ST.wordCount, 1, 200));
    S.totalChars = S.queue.reduce((a,e) => a + e[0].length, 0) || 1;
    $('#text').textContent = '';
    resetHud();
    loadCard();
    applyST();
    $('#stage').classList.remove('paused');
    return;
  }

  if(reuse && S._reuseText){ S.target = S._reuseText; S._reuseText = null; }
  else if(S.mode === 'lesson') S.target = genLesson();
  else if(S.mode === 'text') S.target = genText();
  else if(S.mode === 'weak'){
    const w = genWeak();
    S.target = w.text;
    if(w.reason === 'no-data'){
      $('#notice').textContent = '暂无足够的错误样本（每个字母需累计 ≥20 次击键且确实错过）——先用「键位」或「单词」模式练两组，系统会自动找出你的弱键。本组按常规词表出题。';
    } else {
      let txt = '本次专练弱键（按错误率排序）：' + w.weak.map(x => x.c + '(' + Math.round(x.rate*100) + '%)').join('  ');
      if(w.reason === 'thin-pool') txt += '　含这些字母的词偏少，已混合常规词表。';
      $('#notice').textContent = txt;
    }
  }
  else if(S.mode === 'sprint'){ S.target = genWords(40, 'all'); S.limit = parseInt($('#sprintSel').value, 10); }
  else S.target = genWords(36);

  S.state = new Array(S.target.length).fill(0);
  S.posTried = new Uint8Array(S.target.length);
  renderText();
  resetHud();
  kbNext();
  applyST();
  $('#stage').classList.remove('paused');
}

/* ---------- 字典模式（单词 / 句段） ---------- */
function fitCardWord(len){
  const w = ($('#card').clientWidth || 820) - 16;
  const el = $('#cword');
  if(S.mode === 'phrase'){
    /* 句段较长，允许折行，字号收在 20–34px */
    el.style.fontSize = clamp(Math.floor(w * 3 / Math.max(len, 24)), 20, 34) + 'px';
    el.style.lineHeight = '1.6';
  } else {
    el.style.fontSize = clamp(Math.floor(w * 1.5 / Math.max(len, 4)), 22, 56) + 'px';
    el.style.lineHeight = '';
  }
}
function renderCardWord(){
  const host = $('#cword');
  host.textContent = '';
  S.charEls = []; S.lastWordEl = null;
  /* 按词包一层 .w，让折行只发生在词间；空格用定宽 .sp，句段才有正确间距 */
  const frag = document.createDocumentFragment();
  let word = null;
  for(const ch of S.target){
    if(ch === ' '){
      const s = document.createElement('span');
      s.className = 'c sp'; s.textContent = '';
      frag.appendChild(s); S.charEls.push(s); word = null;
    } else {
      if(!word){
        word = document.createElement('span');
        word.className = 'w';
        frag.appendChild(word);
      }
      const c = document.createElement('span');
      c.className = 'c'; c.textContent = ch;
      word.appendChild(c); S.charEls.push(c);
    }
  }
  host.appendChild(frag);
  if(S.charEls[0]) S.charEls[0].classList.add('cur');
  fitCardWord(S.target.length);
  const card = $('#card');
  card.classList.remove('in'); void card.offsetWidth; card.classList.add('in');
}
function renderCardMeta(e){
  if(S.mode === 'phrase'){
    /* 句段模式：不显示音标，改为列出本句的搭配 + 整句译文 */
    $('#cphone').style.display = 'none';
    $('#cmean').innerHTML = (e[1] || []).map(p =>
      '<span class="pp"><b>' + esc(p[0]) + '</b><i>' + esc(p[1]) + '</i></span>').join('');
    const show = ST.showEx && !!e[2];
    $('#cex').style.display = show ? '' : 'none';
    $('#cex').innerHTML = show ? '<div class="cn">' + esc(e[2]) + '</div>' : '';
    return;
  }
  const ipa = e[1] ? '/' + e[1] + '/' : '';
  $('#cphone').textContent = ipa;
  $('#cphone').style.display = ipa ? '' : 'none';
  const senses = e[2] || [];
  $('#cmean').innerHTML = senses.map((s,i) => {
    const n = senses.length > 1 ? '<span class="sn">' + (i+1) + '</span>' : '';
    const pos = s[0] ? '<span class="pos">' + esc(s[0]) + '.</span>' : '';
    return n + pos + esc(s[1]);
  }).join('<br>') || '<span style="color:var(--faint)">（该词无中文释义）</span>';
  const show = ST.showEx && !!e[3];
  $('#cex').style.display = show ? '' : 'none';
  $('#cex').innerHTML = show
    ? '<div class="en">' + esc(e[3]) + '</div>' + (e[4] ? '<div class="cn">' + esc(e[4]) + '</div>' : '')
    : '';
}
function updateCardProg(){
  $('#cprog').textContent = '第 ' + (S.idx + 1) + ' / ' + S.queue.length + (S.mode === 'phrase' ? ' 段' : ' 个词');
}
function loadCard(){
  const e = S.queue[S.idx];
  if(!e){ finish(); return; }
  S.target = e[0];
  S.pos = 0; S.wordErr = 0;
  S.state = new Array(S.target.length).fill(0);
  S.posTried = new Uint8Array(S.target.length);
  renderCardWord();
  renderCardMeta(e);
  updateCardProg();
  kbNext();
  updHud();
}
function nextCard(){
  S.wordLog.push({ w: S.target, errs: S.wordErr });
  if(S.wordErr) S.badWords.add(S.target);
  S.doneChars += S.target.length;
  S.idx++;
  if(S.idx >= S.queue.length){ finish(); return; }
  loadCard();
}
function skipCard(){
  if(S.done) return;
  if(!S.running){
    S.running = true; S.startTs = Date.now(); S.pausedMs = 0; S.lastTs = 0;
    startTimer();
  }
  S.wordLog.push({ w: S.target, errs: S.wordErr, skipped: true });
  S.badWords.add(S.target);
  S.doneChars += S.target.length;
  S.idx++;
  if(S.idx >= S.queue.length){ finish(); return; }
  loadCard();
}

/* ---------- 计时 ---------- */
function elapsed(){
  if(!S.startTs) return 0;
  const now = S.paused ? S.pauseTs : Date.now();
  return Math.max(0, (now - S.startTs - S.pausedMs)/1000);
}
function startTimer(){
  if(S.tick) return;
  S.tick = setInterval(()=>{
    if(!S.running || S.paused) return;
    const e = elapsed();
    if(S.mode === 'sprint'){
      const left = Math.max(0, S.limit - e);
      $('#hTime').textContent = left.toFixed(1);
      $('#bar').style.width = clamp((1 - left/S.limit)*100, 0, 100).toFixed(1) + '%';
      if(left <= 0){ finish(); return; }
    } else {
      $('#hTime').textContent = e.toFixed(1);
    }
    updHud();
  }, 100);
}
function metrics(){
  const e = elapsed();
  const min = e / 60;
  const wpm = min > .01 ? (S.settled/5)/min : 0;
  const kpm = min > .01 ? S.keys/min : 0;
  const acc = S.tried ? S.firstOk/S.tried*100 : 100;
  let cons = null;
  if(S.gaps.length >= 8){
    const m = S.gaps.reduce((a,b)=>a+b,0)/S.gaps.length;
    const sd = Math.sqrt(S.gaps.reduce((a,b)=>a+(b-m)*(b-m),0)/S.gaps.length);
    cons = m > 0 ? clamp(100*(1 - sd/m), 0, 100) : null;
  }
  return { e, wpm, kpm, acc, cons };
}
function updHud(){
  const m = metrics();
  $('#hWpm').textContent = Math.round(m.wpm);
  $('#hAcc').textContent = Math.round(m.acc) + '%';
  $('#hKeys').textContent = S.keys;
  $('#hErr').textContent = S.errs;
  $('#hErr').classList.toggle('bad', S.errs > 0);
  if(S.mode !== 'sprint') $('#hTime').textContent = m.e.toFixed(1);
}

/* ---------- 输入 ---------- */
function wordAt(i){
  let a = i, b = i;
  while(a > 0 && S.target[a-1] !== ' ') a--;
  while(b < S.target.length && S.target[b] !== ' ') b++;
  return S.target.slice(a, b).replace(/[^a-zA-Z',.\/-]/g, '');
}
function typeChar(ch){
  const want = S.target[S.pos];
  if(want == null) return;
  const now = Date.now();
  S.keys++;
  kbHit(ch);

  S.tries[want] = (S.tries[want] || 0) + 1;

  if(ch === want){
    if(!S.posTried[S.pos]){ S.posTried[S.pos] = 1; S.tried++; S.firstOk++; }
    S.state[S.pos] = 1;
    S.settled++;
    if(S.lastTs){
      const dt = now - S.lastTs;
      S.gaps.push(dt);
      if(!S.lat[want]) S.lat[want] = { s:0, n:0 };
      S.lat[want].s += dt; S.lat[want].n++;
    }
    S.lastTs = now;
    beep(880, .03, .05);
    advance();
  } else {
    S.errs++;
    S.errByWant[want] = (S.errByWant[want] || 0) + 1;
    S.errDetail[want + '\u0000' + ch] = (S.errDetail[want + '\u0000' + ch] || 0) + 1;
    S.conf[want + '\u0000' + ch] = (S.conf[want + '\u0000' + ch] || 0) + 1;
    if(!S.posTried[S.pos]){ S.posTried[S.pos] = 1; S.tried++; }
    S.state[S.pos] = 2;
    S.wordErr++;
    if(S.view === 'flow'){ const w = wordAt(S.pos); if(w) S.badWords.add(w); }
    beep(220, .08, .07);
    if(ST.strict){
      S.charEls[S.pos].classList.add('no');
      updHud();
    } else {
      advance();
    }
  }
}
function progressPct(){
  if(S.view === 'card') return clamp((S.doneChars + S.pos) / (S.totalChars || 1) * 100, 0, 100);
  return clamp(S.pos / (S.target.length || 1) * 100, 0, 100);
}
function advance(){
  const prev = S.charEls[S.pos];
  if(prev){
    prev.classList.remove('cur','ok','no');
    prev.classList.add(S.state[S.pos] === 2 ? 'no' : 'ok');
  }
  S.pos++;
  if(S.mode === 'sprint'){
    if(S.target.length - S.pos < 40) appendSprint();
  } else if(S.view === 'card'){
    if(S.pos >= S.target.length){ nextCard(); return; }
  } else if(S.pos >= S.target.length){
    finish(); return;
  }
  const cur = S.charEls[S.pos];
  if(cur){
    cur.classList.add('cur');
    if(S.state[S.pos] === 2) cur.classList.add('no');
    if(S.view === 'flow'){
      const box = $('#text');
      const top = cur.offsetTop - box.offsetTop;
      if(top > box.scrollTop + box.clientHeight - 70) box.scrollTop = top - 70;
    }
  }
  kbNext();
  updHud();
  if(S.mode !== 'sprint') $('#bar').style.width = progressPct().toFixed(1) + '%';
}
function appendSprint(){
  const add = ' ' + sampleWords(WORDLIST, 12).join(' ');
  S.target += add;
  const next = new Uint8Array(S.target.length);
  next.set(S.posTried); S.posTried = next;
  for(let i=0;i<add.length;i++) S.state.push(0);
  pushText(add);
}
function backspace(){
  if(S.pos <= 0) return;
  const cur = S.charEls[S.pos];
  if(cur) cur.classList.remove('cur','no');
  S.pos--;
  if(S.state[S.pos] === 1) S.settled--;
  S.state[S.pos] = 0;
  const p = S.charEls[S.pos];
  if(p){ p.classList.remove('ok','no'); p.classList.add('cur'); }
  S.backs++;
  S.lastTs = 0;
  kbNext();
  if(S.mode !== 'sprint') $('#bar').style.width = progressPct().toFixed(1) + '%';
}

/* ---------- 结算 ---------- */
function mergeKeyStats(){
  const st = keyStats();
  const decay = 0.97;
  ['err','tries','conf'].forEach(bucket=>{
    Object.keys(st[bucket]).forEach(k=>{
      st[bucket][k] *= decay;
      if(st[bucket][k] < .05) delete st[bucket][k];
    });
  });
  Object.keys(S.tries).forEach(c=>{ st.tries[c] = (st.tries[c] || 0) + S.tries[c]; });
  Object.keys(S.errByWant).forEach(c=>{ st.err[c] = (st.err[c] || 0) + S.errByWant[c]; });
  Object.keys(S.conf).forEach(k=>{ st.conf[k] = (st.conf[k] || 0) + S.conf[k]; });
  Object.keys(S.lat).forEach(c=>{
    const prev = st.lat[c] || { s:0, n:0 };
    st.lat[c] = { s: prev.s + S.lat[c].s, n: prev.n + S.lat[c].n };
  });
  save(LSKEY, st);
  try{ localStorage.removeItem(LSOLD); }catch(e){}
}
function sanRec(r){
  if(!r || typeof r !== 'object') return null;
  const n = (v,d) => isNum(v) ? v : d;
  const rec = {
    t: n(r.t, Date.now()),
    mode: MODES.indexOf(r.mode) > -1 ? r.mode : 'word',
    wpm: Math.max(0, Math.round(n(r.wpm, 0))),
    acc: clamp(Math.round(n(r.acc, 0)), 0, 100),
    kpm: Math.max(0, Math.round(n(r.kpm, 0))),
    dur: Math.max(0, +n(r.dur, 0).toFixed(1)),
    keys: Math.max(0, Math.round(n(r.keys, 0))),
    errs: Math.max(0, Math.round(n(r.errs, 0))),
    backs: Math.max(0, Math.round(n(r.backs, 0)))
  };
  rec.cons = isNum(r.cons) ? clamp(Math.round(r.cons), 0, 100) : null;
  return rec;
}
function history(){
  return loadArr(LSHIS).map(sanRec).filter(Boolean).slice(-500);
}
function finish(){
  if(S.done) return;
  S.done = true; S.running = false;
  clearInterval(S.tick); S.tick = null;
  $('#bar').style.width = '100%';

  const m = metrics();
  const rec = {
    t: Date.now(), mode: S.mode, wpm: Math.round(m.wpm), acc: Math.round(m.acc),
    kpm: Math.round(m.kpm), cons: m.cons == null ? null : Math.round(m.cons),
    dur: +m.e.toFixed(1), keys: S.keys, errs: S.errs, backs: S.backs
  };
  const hist = history();
  const sameMode = hist.filter(r => r.mode === S.mode);
  const prev = sameMode.length ? sameMode[sameMode.length - 1] : null;
  const pb = sameMode.reduce((a,r) => Math.max(a, r.wpm), 0);

  hist.push(rec); save(LSHIS, hist.slice(-500));
  mergeKeyStats();
  if(S.mode === 'lesson' && rec.acc >= 90){
    const want = Math.min(LESSONS.length, Math.max(load(LSUNL, 3, v => typeof v === 'number'), ST.lesson + 2));
    save(LSUNL, want);
    fillLessonSel();
  }
  showResult(rec, prev, pb);
}

function showResult(rec, prev, pb){
  const errList = Object.keys(S.errDetail)
    .map(k => { const p = k.split('\u0000'); return { want:p[0], got:p[1], n:S.errDetail[k] }; })
    .sort((a,b) => b.n - a.n).slice(0, 14);
  const slow = Object.keys(S.lat)
    .filter(c => S.lat[c].n >= 3)
    .map(c => ({ c, ms: S.lat[c].s / S.lat[c].n }))
    .sort((a,b) => b.ms - a.ms).slice(0, 6);
  const disp = c => c === ' ' ? '空格' : esc(c);
  const delta = prev ? rec.wpm - prev.wpm : null;
  const isPb = rec.wpm > pb;

  $('#dlgResult').innerHTML =
    '<h2>本次成绩</h2><div class="sub">' + MODE_CN[rec.mode] + '模式 · ' + rec.dur + ' 秒</div>' +
    '<div class="big">' +
      '<div class="bigc"><div class="lb">速度 WPM（净）</div><div class="v">' + rec.wpm + '</div>' +
        (isPb ? '<span class="badge">个人最好</span>' : '') + '</div>' +
      '<div class="bigc"><div class="lb">准确率（首击）</div><div class="v' + (rec.acc < 95 ? ' bad' : '') + '">' + rec.acc + '%</div></div>' +
    '</div>' +
    '<div class="cmp">' +
      (delta == null
        ? '这是本模式的第一次记录，之后会显示与上一次的对比。'
        : '与上一次' + MODE_CN[rec.mode] + '相比：WPM <b class="' + (delta >= 0 ? 'up' : 'dn') + '">' +
          (delta >= 0 ? '+' : '') + delta + '</b>' + (prev ? '（上次 ' + prev.wpm + '）' : '') +
          '，本模式历史最好 <b>' + pb + '</b>。') +
    '</div>' +
    '<div class="mini">' +
      '<div><div class="lb">击键/分</div><div class="v">' + rec.kpm + '</div></div>' +
      '<div><div class="lb">击键数</div><div class="v">' + rec.keys + '</div></div>' +
      '<div><div class="lb">错误</div><div class="v">' + rec.errs + '</div></div>' +

/* ---------- 键盘事件 ---------- */
document.addEventListener('keydown', e=>{
  if(e.isComposing) return;
  if($('#mSetting').classList.contains('on') || $('#mStats').classList.contains('on')) return;

  if($('#mResult').classList.contains('on')){
    if(e.key === 'Enter'){ e.preventDefault(); closeMask('#mResult'); newSession(S.mode); }
    return;
  }
  if(e.key === 'Tab'){ e.preventDefault(); newSession(S.mode); return; }
  if(e.key === 'Escape'){
    e.preventDefault();
    if(!S.running) return;
    S.paused = !S.paused;
    if(S.paused){ S.pauseTs = Date.now(); }
    else { S.pausedMs += Date.now() - S.pauseTs; S.lastTs = 0; }
    $('#stage').classList.toggle('paused', S.paused);
    return;
  }
  if(e.ctrlKey || e.metaKey || e.altKey) return;

  if(e.key === 'Backspace'){
    e.preventDefault();
    if(ST.noBack || !S.running || S.done) return;
    backspace();
    return;
  }
  if(e.key.length !== 1) return;
  e.preventDefault();
  if(S.done || S.paused) return;
  if(!S.running){
    S.running = true;
    S.startTs = Date.now(); S.pausedMs = 0; S.lastTs = 0;
    startTimer();
  }
  typeChar(e.key);
});
document.addEventListener('paste', e=>{
  if(e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;

});

/* ---------- 图表 ---------- */
function cssv(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function drawChart(cv, vals, color, kind){
  if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 240, h = cv.clientHeight || 104;
  cv.width = w*dpr; cv.height = h*dpr;
  const g = cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const pad = { l:32, r:8, t:10, b:16 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  if(!vals.length){ return; }
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if(kind === 'wpm'){ lo = 0; hi = Math.ceil(hi*1.1) || 1; }
  else {
    lo = Math.max(0, Math.floor(lo) - 5);
    hi = Math.min(100, Math.ceil(hi) + 2);
    if(hi - lo < 6) hi = Math.min(100, lo + 6);
    if(hi <= lo) lo = Math.max(0, hi - 6);
  }
  const X = i => pad.l + (vals.length === 1 ? iw/2 : iw*i/(vals.length-1));
  const Y = v => pad.t + ih*(1 - (v-lo)/(hi-lo));

  g.strokeStyle = cssv('--line2'); g.lineWidth = 1;
  [0,.5,1].forEach(t=>{ g.beginPath(); g.moveTo(pad.l, pad.t+ih*t); g.lineTo(w-pad.r, pad.t+ih*t); g.stroke(); });
  g.fillStyle = cssv('--faint'); g.font = '10.5px sans-serif'; g.textAlign = 'right';
  g.fillText(Math.round(hi), pad.l-5, pad.t+8);
  g.fillText(Math.round(lo), pad.l-5, pad.t+ih);

  g.beginPath();
  vals.forEach((v,i)=>{ i ? g.lineTo(X(i),Y(v)) : g.moveTo(X(i),Y(v)); });
  g.strokeStyle = color; g.lineWidth = 1.6; g.lineJoin = 'round'; g.stroke();
  g.lineTo(X(vals.length-1), pad.t+ih); g.lineTo(X(0), pad.t+ih); g.closePath();
  g.fillStyle = color + '22'; g.fill();
  g.beginPath(); g.arc(X(vals.length-1), Y(vals[vals.length-1]), 2.6, 0, Math.PI*2);
  g.fillStyle = color; g.fill();

  g.textAlign = 'left'; g.fillStyle = cssv('--muted'); g.font = '10.5px sans-serif';
  g.fillText('共 ' + vals.length + ' 次 · 最新 ' + vals[vals.length-1], pad.l, h-4);
}

/* ---------- 键盘热力图 ---------- */
function heatColor(t){
  const a = [63,143,90], b = [217,161,59], c = [192,57,43];
  let r, g, bl;
  if(t < .5){ const k = t/.5; r = a[0]+(b[0]-a[0])*k; g = a[1]+(b[1]-a[1])*k; bl = a[2]+(b[2]-a[2])*k; }
  else { const k = (t-.5)/.5; r = b[0]+(c[0]-b[0])*k; g = b[1]+(c[1]-b[1])*k; bl = b[2]+(c[2]-b[2])*k; }
  return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(bl) + ')';
}
function drawHeat(metric){
  const st = keyStats();
  const host = $('#heatkb');
  if(!host) return;
  const dark = ST.theme === 'dark';
  const KEYS = ['\`','1','2','3','4','5','6','7','8','9','0','-','=',
    'q','w','e','r','t','y','u','i','o','p','[',']',
    'a','s','d','f','g','h','j','k','l',';',"'",
    'z','x','c','v','b','n','m',',','.','/',' '];
  const data = {};
  let max = 0;
  KEYS.forEach(k=>{
    const tries = st.tries[k] || 0;
    if(tries < 1) return;
    let v = null;
    if(metric === 'rate'){ if(tries >= 5) v = (st.err[k] || 0)/tries; }
    else { const l = st.lat[k]; if(l && l.n >= 3) v = l.s/l.n; }
    if(v == null) return;
    data[k] = v;
    if(v > max) max = v;
  });
  const neutral = dark ? '#1c1c1c' : '#f2f1ec';
  const tile = k => {
    const v = data[k];
    let style = ' style="background:' + neutral + '"', txt = '—';
    if(v !== undefined){
      const errs = st.err[k] || 0;
      if(metric === 'rate' && errs < 1){
        txt = '0%';
      } else if(max > 0){
        const t = metric === 'rate' ? clamp(v/max, 0, 1) : clamp(1 - v/Math.max(max, 1), 0, 1);
        const hex = rgbToHex(heatColor(t));
        style = ' style="background:' + mixHex(hex, dark ? '#151515' : '#ffffff', dark ? .5 : .45) + '"';
        txt = metric === 'rate' ? Math.round(v*100) + '%' : Math.round(v);
      }
    }
    return style + '><span>' + (k === ' ' ? '' : esc(k)) + '</span><small>' + txt + '</small>';
  };
  const rows = [];
  KEYROWS.forEach(row=>{
    const cells = row.map(k=>{
      const isSh = k.indexOf('SHIFT') === 0;
      const cls = 'hk' + (isSh ? ' sh' : '');
      if(isSh) return '<div class="' + cls + '" style="color:var(--faint)"><span>⇧</span><small></small></div>';
      return '<div class="' + cls + '"' + tile(k) + '</div>';
    });
    rows.push('<div class="kbr">' + cells.join('') + '</div>');
  });
  rows.push('<div class="kbr"><div class="hk wide"' + tile(' ') + '</div></div>');
  host.innerHTML = rows.join('');
}
function rgbToHex(s){
  const m = s.match(/\d+/g);
  if(!m) return '#888888';
  return '#' + m.slice(0,3).map(v => (+v).toString(16).padStart(2,'0')).join('');
}

function paintStatsBody(){
  const all = history();
  const filt = $('#statsMode') ? $('#statsMode').value : 'all';
  const list = filt === 'all' ? all : all.filter(r => r.mode === filt);
  const body = $('#statsBody');
  if(!list.length){
    body.innerHTML = '<div class="empty">' + (all.length ? '这个模式还没有记录' : '还没有记录，打完一组就会出现在这里') + '</div>';
    return;
  }
  const avg = a => a.reduce((x,y)=>x+y,0)/a.length;
  const wpms = list.map(r => r.wpm);
  const accs = list.map(r => r.acc);
  const cons = list.filter(r => r.cons != null).map(r => r.cons);
  const best = Math.max.apply(null, wpms);
  const last = list[list.length - 1];
  const sum =
    '<div class="sumcards">' +
      '<div><div class="lb">平均 WPM</div><div class="v">' + Math.round(avg(wpms)) + '</div></div>' +
      '<div><div class="lb">最好 WPM</div><div class="v">' + best + '</div></div>' +
      '<div><div class="lb">最近 WPM</div><div class="v">' + last.wpm + '</div></div>' +
      '<div><div class="lb">平均准确率</div><div class="v">' + Math.round(avg(accs)) + '%</div></div>' +
      '<div><div class="lb">平均稳定性</div><div class="v">' + (cons.length ? Math.round(avg(cons)) : '—') + '</div></div>' +
      '<div><div class="lb">累计时长</div><div class="v">' + Math.round(list.reduce((a,r)=>a+r.dur,0)/60) + ' 分</div></div>' +
    '</div>';
  const recent = list.slice(-24);
  const charts = recent.length >= 3
    ? '<div class="charts">' +
        '<div class="chartbox"><div class="t">速度趋势（WPM）</div><canvas id="c1"></canvas></div>' +
        '<div class="chartbox"><div class="t">准确率趋势（%）</div><canvas id="c2"></canvas></div>' +
        (recent.filter(r=>r.cons!=null).length >= 3
          ? '<div class="chartbox"><div class="t">稳定性趋势</div><canvas id="c3"></canvas></div>' : '') +
      '</div>'
    : '<div class="chartbox" style="border:none;padding:0"><div class="t">样本少于 3 次，暂不画折线（折线在这个量级没有信息量），先看上方的统计数字。</div></div>';
  const rows = list.slice(-30).reverse().map(r=>{
    const d = new Date(r.t);
    const p = x => String(x).padStart(2,'0');
    return '<tr><td class="dim">' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + '</td>' +
      '<td class="dim">' + MODE_CN[r.mode] + '</td><td>' + r.wpm + '</td><td>' + r.acc + '%</td>' +
      '<td class="dim">' + (r.cons == null ? '—' : r.cons) + '</td><td class="dim">' + r.dur + 's</td>' +
      '<td class="dim">' + r.errs + '</td><td class="dim">' + r.backs + '</td></tr>';
  }).join('');
  body.innerHTML = sum + charts +
    '<div class="sec">明细（最近 ' + Math.min(30, list.length) + ' 次）</div>' +
    '<table class="hist"><thead><tr><th>时间</th><th>模式</th><th>WPM</th><th>准确率</th><th>稳定性</th><th>时长</th><th>错误</th><th>退格</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';

  requestAnimationFrame(()=>{
    drawChart($('#c1'), recent.map(r=>r.wpm), '#1f6fb2', 'wpm');
    drawChart($('#c2'), recent.map(r=>r.acc), '#1d9e75', 'pct');

  });

    sw('strict','严格模式','打错不能前进，必须改对才继续', ST.strict) +
    sw('noBack','禁用退格','逼自己一次打对，不回头改（也会顺带堵住退格刷分）', ST.noBack) +
    sw('hint','下一键提示','高亮下一个要按的键，并提示该用哪根手指、要不要按 Shift', ST.hint) +
    sw('sound','按键音效','轻微点击音，默认关闭', ST.sound) +
    sw('showEx','例句与译文','单词模式显示例句；句段模式显示整句译文', ST.showEx) +
    '<div class="setrow"><div><div>虚拟键盘</div><div class="d">指法配色 / 简约（只在按下的键上着色）/ 隐藏</div></div>' +
      '<select class="ghost" id="setKb">' +
        '<option value="finger"' + (ST.kbStyle==='finger'?' selected':'') + '>指法配色</option>' +
        '<option value="plain"' + (ST.kbStyle==='plain'?' selected':'') + '>简约</option>' +
        '<option value="off"' + (ST.kbStyle==='off'?' selected':'') + '>隐藏</option>' +
      '</select></div>' +
    '<div class="setrow"><div><div>字号</div><div class="d">跟打文字的大小（窄屏自动收窄，不会失效）</div></div>' +
      '<select class="ghost" id="setSize">' +
        [18,20,22,26,30].map(v => '<option value="' + v + '"' + (ST.size===v?' selected':'') + '>' + v + ' px</option>').join('') +
      '</select></div>' +
    '<div class="setrow"><div><div>课程解锁</div><div class="d">当前已解锁 ' + unlock + ' / ' + LESSONS.length + ' 级；每级准确率 ≥90% 自动解锁下一级</div></div>' +
      '<button class="ghost" id="setUnlock">全部解锁</button></div>' +
    '<div class="setrow"><div><div>弱键统计</div><div class="d">累计击键与错误，按会话衰减</div></div>' +
      '<button class="ghost danger" id="setWeak">重置</button></div>' +
    '<div class="sec">自定义文稿（选「文章」模式时随机使用；一行一段，最多 20 段）</div>' +
    '<textarea id="setText" placeholder="把要练的英文段落粘到这里，一行一段"></textarea>' +
    '<div class="acts">' +
      '<button id="setSaveTxt">保存文稿</button>' +
      '<button id="setClose" class="pri">关闭</button>' +
    '</div>';

  const custom = load(LSTXT, [], Array.isArray);
  $('#setText').value = Array.isArray(custom) ? custom.join('\n') : '';
  $('#mSetting').classList.add('on');
  $('#dlgSetting').focus();

  $('#dlgSetting').querySelectorAll('[data-sw]').forEach(b=>{
    b.onclick = ()=>{ const k = b.dataset.sw; ST[k] = !ST[k]; b.textContent = ST[k] ? '开' : '关'; applyST(); };
  });
  $('#setKb').onchange = e=>{ ST.kbStyle = e.target.value; applyST(); };
  $('#setSize').onchange = e=>{ ST.size = parseInt(e.target.value, 10); applyST(); };
  $('#setUnlock').onclick = ()=>{ save(LSUNL, LESSONS.length); fillLessonSel(); $('#setUnlock').textContent = '已全部解锁'; };
  $('#setWeak').onclick = ()=>{ save(LSKEY, {err:{}, tries:{}, lat:{}, conf:{}}); toast('#setWeak', '已重置'); };
  $('#setSaveTxt').onclick = ()=>{
    const arr = $('#setText').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 20);
    save(LSTXT, arr);
    toast('#setSaveTxt', '已保存 ' + arr.length + ' 段');
  };
  $('#setClose').onclick = ()=>closeMask('#mSetting');
}
function toast(sel, msg){
  const el = $(sel);
  if(!el) return;
  const old = el.textContent;
  el.textContent = msg;
  setTimeout(()=>{ el.textContent = old; }, 1400);
}

/* ---------- 初始化 ---------- */
function fillLessonSel(){
  const unlock = clamp(load(LSUNL, 3, v => typeof v === 'number'), 1, LESSONS.length);
  $('#lessonSel').innerHTML = LESSONS.map((l,i) =>
    '<option value="' + i + '"' + (i >= unlock ? ' disabled' : '') + '>' + l.name + (i >= unlock ? '（未解锁）' : '') + '</option>'
  ).join('');
  if(ST.lesson >= unlock) ST.lesson = unlock - 1;
  $('#lessonSel').value = ST.lesson;
  $('#wordLenSel').value = ST.wordLen;
  $('#wordCountSel').value = ST.wordCount;
  $('#phraseCatSel').value = ST.phraseCat;
  $('#phraseCountSel').value = String(ST.phraseCount);
}
function init(){
  const custom = load(LSTXT, [], Array.isArray);
  if(Array.isArray(custom) && custom.length){ PARAS.length = 0; custom.forEach(p => PARAS.push(p)); }

  buildKb();
  fillLessonSel();
  $('#sprintSel').value = '30';

  $('#tabs').addEventListener('click', e=>{
    const b = e.target.closest('.tab'); if(!b) return;
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('on', t === b));
    newSession(b.dataset.mode);
  });
  $('#lessonSel').onchange = e=>{ ST.lesson = parseInt(e.target.value, 10); save(LSSET, ST); newSession('lesson'); };
  $('#wordLenSel').onchange = e=>{ ST.wordLen = e.target.value; save(LSSET, ST); newSession(S.mode); };
  $('#wordCountSel').onchange = e=>{ ST.wordCount = parseInt(e.target.value, 10); save(LSSET, ST); newSession(S.mode); };
  $('#phraseCatSel').onchange = e=>{ ST.phraseCat = e.target.value; save(LSSET, ST); newSession('phrase'); };
  $('#phraseCountSel').onchange = e=>{ ST.phraseCount = parseInt(e.target.value, 10); save(LSSET, ST); newSession('phrase'); };
  $('#cskip').onclick = skipCard;
  $('#sprintSel').onchange = ()=>{ if(S.mode === 'sprint') newSession('sprint'); };
  $('#btnKb').onclick = ()=>{
    const order = ['finger','plain','off'];
    ST.kbStyle = order[(order.indexOf(ST.kbStyle) + 1) % 3];
    applyST();
  };
  $('#btnSetting').onclick = ()=>{ fillLessonSel(); openSetting(); };
  $('#btnStats').onclick = openStats;
  $('#btnTheme').onclick = ()=>{ ST.theme = ST.theme === 'dark' ? 'light' : 'dark'; applyST(); };
  [$('#mResult'),$('#mSetting'),$('#mStats')].forEach(m=>{
    m.addEventListener('click', e=>{ if(e.target === m) closeMask('#' + m.id); });
  });

  newSession('lesson');
}
init();
</script>
</body>
</html>
